<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunting, Blogging and Cooking</title>
    <link rel="icon" type="image/png" href="/static/images/app-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }
    </script>
    <style>
      body { background-color: transparent !important; }
      #bg-layer { position: fixed; inset: 0; z-index: -1; background-image: url('/static/images/phone-background.png'); background-size: cover; background-position: center; background-color: #0f0f0f; }
      @media (min-width: 1024px) { #bg-layer { background-image: url('/static/images/background-widescreen.png'); background-size: cover; background-repeat: no-repeat; background-position: center; } }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased select-none min-h-dvh flex flex-col">

<div id="bg-layer"></div>

<header class="flex items-center justify-between px-4 py-2 bg-gray-900/95 border-b border-gray-800 sticky top-0 z-50 gap-3">
    <div class="flex items-center gap-1.5 overflow-x-auto">
        <a href="/" class="flex items-center gap-2 pr-4 mr-1.5 border-r border-gray-700 shrink-0 cursor-pointer">
            <img src="/static/images/logo.png" alt="HB&amp;C" class="h-8 w-auto drop-shadow-lg">
            <span class="text-orange-500 font-black text-lg tracking-wide">Hunting, Blogging &amp; Cooking</span>
        </a>
        <a href="/hunting" class="flex flex-col px-3 py-1.5 rounded-lg bg-orange-950/60 hover:bg-orange-900/60 border border-orange-800/40 hover:border-orange-500/40 transition shrink-0">
            <span class="text-sm font-bold text-white">Hunting</span>
            <span class="text-[10px] text-orange-400/70">Seasons &amp; regulations</span>
        </a>
        <a href="/logbook" class="flex flex-col px-3 py-1.5 rounded-lg bg-emerald-950/60 hover:bg-emerald-900/60 border border-emerald-800/40 hover:border-emerald-500/40 transition shrink-0">
            <span class="text-sm font-bold text-white">Logbook</span>
            <span class="text-[10px] text-emerald-400/70">Hunts &amp; harvests</span>
        </a>
        <a href="/recipes" class="flex flex-col px-3 py-1.5 rounded-lg bg-rose-950/60 hover:bg-rose-900/60 border border-rose-800/40 hover:border-rose-500/40 transition shrink-0">
            <span class="text-sm font-bold text-white">Recipes</span>
            <span class="text-[10px] text-rose-400/70">Wild game cookbook</span>
        </a>
    </div>
    <div class="relative shrink-0">
        <button onclick="toggleUserMenu('user-menu')" class="flex items-center gap-1.5 px-2.5 py-2 rounded-lg hover:bg-gray-800 transition cursor-pointer">
            <span class="text-sm">⚙️</span>
            <span class="text-sm font-medium text-gray-300">{{ user.username }}</span>
            <span id="user-menu-arrow" class="text-gray-500 text-xs transition-transform duration-200">▼</span>
        </button>
        <div id="user-menu" class="hidden absolute top-full right-0 mt-1 w-56 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl overflow-hidden z-50">
            {% if user.is_admin %}
            <a href="/admin/users" class="flex items-center gap-2 px-4 py-2.5 text-sm text-gray-300 hover:bg-gray-700 transition">👤 Users</a>
            <a href="/admin/hunting" class="flex items-center gap-2 px-4 py-2.5 text-sm text-orange-300 hover:bg-orange-900/30 transition">🌲 Add Hunting Data</a>
            <a href="/admin/backup" class="flex items-center gap-2 px-4 py-2.5 text-sm text-green-300 hover:bg-green-900/30 transition">💾 Backup</a>
            {% if upgrade_available %}<a href="/admin/upgrade" class="flex items-center gap-2 px-4 py-2.5 text-sm text-cyan-300 hover:bg-cyan-900/30 transition">🚀 Upgrade</a>{% endif %}
            <a href="/admin/phone-setup" class="flex items-center gap-2 px-4 py-2.5 text-sm text-purple-300 hover:bg-purple-900/30 transition">📱 Phone/Tablet Setup</a>
            {% endif %}
            <a href="/logout" class="flex items-center gap-2 px-4 py-2.5 text-sm text-red-400 hover:bg-red-900/40 transition">🚪 Sign Out</a>
        </div>
    </div>
</header>

<main class="flex-1">
</main>

<script>
function toggleUserMenu(id) {
    const menu = document.getElementById(id);
    const arrow = document.getElementById(id + '-arrow');
    if (!menu) return;
    const isOpen = !menu.classList.contains('hidden');
    menu.classList.toggle('hidden');
    if (arrow) arrow.style.transform = isOpen ? '' : 'rotate(180deg)';
}
document.addEventListener('click', e => {
    const menu = document.getElementById('user-menu');
    if (menu && !menu.classList.contains('hidden') && !menu.parentElement.contains(e.target)) {
        menu.classList.add('hidden');
        const arrow = document.getElementById('user-menu-arrow');
        if (arrow) arrow.style.transform = '';
    }
});
</script>
</body>
</html>
